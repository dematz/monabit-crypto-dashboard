services:
  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - backend

  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    ports:
      - "4000:8080"
    env_file:
      - ../../apps/backend/.env
    environment:
      - NODE_ENV=development
      - MOCK_CRYPTO=true
