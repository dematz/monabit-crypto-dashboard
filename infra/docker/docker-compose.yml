# =============================================================================
# MonaBit — Docker Compose (production-like with env vars)
# =============================================================================
# Usage:
#   docker compose --env-file .env.docker up --build
#
# Variables can be overridden in .env.docker or via shell env vars.
# =============================================================================

services:
  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: monabit-backend
    ports:
      - '${DOCKER_BACKEND_PORT:-4000}:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      COINGECKO_API_URL: ${COINGECKO_API_URL:-https://api.coingecko.com/api/v3}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3100}
      MOCK_CRYPTO: ${MOCK_CRYPTO:-true}
      CACHE_TTL_TOP10: ${CACHE_TTL_TOP10:-60}
      CACHE_TTL_MARKET_OVERVIEW: ${CACHE_TTL_MARKET_OVERVIEW:-120}
      CACHE_TTL_COIN_HISTORY: ${CACHE_TTL_COIN_HISTORY:-300}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://stream.binance.com:9443}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://localhost:54321}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:4000/ws/prices}
        NGINX_CONF: nginx.docker.conf
    container_name: monabit-frontend
    ports:
      - '${DOCKER_FRONTEND_PORT:-3000}:8080'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
