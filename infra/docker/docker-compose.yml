services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - '3000:8080'
    depends_on:
      - backend

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    ports:
      - '4000:8080'
    env_file:
      - ../../apps/backend/.env
    environment:
      - NODE_ENV=development
      - MOCK_CRYPTO=true
