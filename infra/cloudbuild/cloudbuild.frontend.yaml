# Cloud Build config for MonaBit frontend.
# VITE_ vars are public client-side keys (embedded in JS bundle at build time).
# SUPABASE_ANON_KEY is safe to expose — it's designed for browser use.
# Must provide all substitutions via --substitutions flag or deploy.sh script.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/monabit-registry/frontend:latest'
      - '-f'
      - 'apps/frontend/Dockerfile'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}'
      - '--build-arg'
      - 'VITE_WS_URL=${_VITE_WS_URL}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/monabit-registry/frontend:latest'

substitutions:
  _VITE_API_URL: 'https://monabit-backend-290867308628.us-central1.run.app'
  _VITE_SUPABASE_URL: 'REQUIRED — pass via --substitutions=_VITE_SUPABASE_URL=...'
  _VITE_SUPABASE_ANON_KEY: 'REQUIRED — pass via --substitutions=_VITE_SUPABASE_ANON_KEY=...'
  _VITE_WS_URL: 'wss://monabit-backend-290867308628.us-central1.run.app/ws/prices'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/monabit-registry/frontend:latest'
