# Cloud Build config for MonaBit backend.
# Secrets are injected at Cloud Run deploy time via --set-secrets (see scripts/deploy.sh).
# Required GCP secrets: supabase-anon-key, supabase-service-role-key,
#   allowed-origins, coingecko-api-key, groq-api-key
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/monabit-registry/backend:${SHORT_SHA}'
      - '-f'
      - 'apps/backend/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/monabit-registry/backend:${SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/monabit-registry/backend:${SHORT_SHA}'
